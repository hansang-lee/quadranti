name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Analyze and test
        run: scripts/test/check.sh

      - name: Keep the run logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/

      # Built for GitHub Pages, which serves the site under /quadranti/.
      - name: Build web
        run: flutter build web --release --base-href /quadranti/

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  # The scenario tests (integration_test/) in headless Chrome, with the
  # runner's preinstalled Chrome and matching chromedriver. Screenshots and
  # logs are kept as the 'scenarios' artifact on every run.
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Scenario tests (web)
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" scripts/test/scenario.sh --web

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenarios
          path: out/

  # Publishes https://hansang-lee.github.io/quadranti/ after a green master build.
  deploy:
    needs: [test, scenarios]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
