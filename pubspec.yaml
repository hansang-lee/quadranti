name: quadranti
description: Weekly Scheduler based on 4 quadrant properties.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  crypto: ^3.0.3
  flutter_svg: ^2.0.7
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # IBM Plex Sans KR (OFL, assets/fonts/OFL.txt). Only 400 and 700 are
  # bundled (~2.8 MB each); other weights resolve to the nearest one.
  fonts:
    - family: IBMPlexSansKR
      fonts:
        - asset: assets/fonts/IBMPlexSansKR-Regular.ttf
        - asset: assets/fonts/IBMPlexSansKR-Bold.ttf
          weight: 700

# App icons: edit assets/icon/*.png, then run `dart run flutter_launcher_icons`.
# The icon shows the four quadrant colours in their graph positions.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#3F51B5"
    theme_color: "#3F51B5"
